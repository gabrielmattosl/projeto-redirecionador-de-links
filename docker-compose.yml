version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: redirecionador_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: redirecionador_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d redirecionador_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: redirecionador_server
    restart: always
    ports:
      - "3333:3333"
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/redirecionador_db
    env_file:
      - ./server/.env
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: redirecionador_web
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_FRONTEND_URL: http://localhost:5173
      VITE_BACKEND_URL: http://localhost:3333
    depends_on:
      - server

volumes:
  postgres_data:
