<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>brev.ly - Encurtador de Links</title>
<!-- Tailwind CSS v3 with forms plugin -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#2c46b1',
              primary: '#2e45bb',
              muted: '#8e9fdc',
              bg: '#e2e5eb',
              card: '#fafafa',
              border: '#d9dce3'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-overrides">
    /* Subtle background match and typography rendering */
    body {
      background-color: #e2e5eb;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-center items-center px-4 sm:px-6 lg:px-8 selection:bg-indigo-100" style="height: 720px; min-height: 720px; max-height: 720px; overflow: hidden;">
<!-- BEGIN: MainContainer -->
<main class="w-full max-w-[1020px] mx-auto" data-purpose="app-shell">
<!-- BEGIN: BrandHeader -->
<header class="mb-6 pl-1" data-purpose="header-brand">
<div class="flex items-center gap-2.5">
<!-- Logo SVG Icon (interlocking rings) -->
<svg aria-hidden="true" class="w-6 h-6 text-[#2c46b1]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" viewBox="0 0 24 24">
<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
</svg>
<span class="text-xl font-bold text-[#2c46b1] tracking-tight lowercase">brev.ly</span>
</div>
</header>
<!-- END: BrandHeader -->
<!-- BEGIN: ContentGrid -->
<div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
<!-- BEGIN: CreateLinkCard -->
<section class="lg:col-span-5 bg-[#fbfbfb] rounded-xl shadow-[0_1px_3px_rgba(0,0,0,0.06)] p-7 border border-white/60" data-purpose="create-link-card">
<h1 class="text-xl font-bold text-gray-900 mb-6 tracking-tight">Novo link</h1>
<form action="#" class="space-y-4" method="POST" onsubmit="event.preventDefault();">
<!-- Input Group: Original Link -->
<div>
<label class="block text-[11px] font-semibold tracking-wider text-gray-400 uppercase mb-2" for="original-link">
              Link Original
            </label>
<input class="w-full h-11 px-3.5 text-sm text-gray-700 placeholder-gray-400 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-colors" id="original-link" name="original_link" placeholder="www.exemplo.com.br" type="text">
</div>
<!-- Input Group: Shortened Link -->
<div>
<label class="block text-[11px] font-semibold tracking-wider text-gray-400 uppercase mb-2" for="shortened-link">
              Link Encurtado
            </label>
<input class="w-full h-11 px-3.5 text-sm text-gray-700 placeholder-gray-400 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-colors" id="shortened-link" name="shortened_link" placeholder="brev.ly/" type="text">
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full h-11 bg-[#8b9fdc] hover:bg-[#7e92d1] text-white text-sm font-semibold rounded-lg shadow-sm transition duration-150 ease-in-out flex items-center justify-center cursor-pointer" type="submit">
              Salvar link
            </button>
</div>
</form>
</section>
<!-- END: CreateLinkCard -->
<!-- BEGIN: MyLinksCard -->
<section class="lg:col-span-7 bg-[#fbfbfb] rounded-xl shadow-[0_1px_3px_rgba(0,0,0,0.06)] p-7 min-h-[300px] flex flex-col border border-white/60" data-purpose="links-list-card">
<!-- Card Header: Title & Export Action -->
<div class="flex items-center justify-between pb-5 border-b border-gray-100">
<h2 class="text-xl font-bold text-gray-900 tracking-tight">Meus links</h2>
<button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-gray-500 bg-gray-100 hover:bg-gray-200 rounded-md transition-colors" title="Baixar CSV" type="button">
<!-- Download Icon -->
<svg aria-hidden="true" class="w-3.5 h-3.5 stroke-[2]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
<polyline points="7 10 12 15 17 10"></polyline>
<line x1="12" x2="12" y1="15" y2="3"></line>
</svg>
<span class="">Baixar CSV</span>
</button>
</div>
<!-- Card Body: Empty State Feedback -->
<div class="flex-1 flex flex-col items-center justify-center py-16 text-center" data-purpose="empty-state-view">
<!-- Chain Link Outline Icon -->
<div class="mb-3 text-slate-500">
<svg aria-hidden="true" class="w-7 h-7 stroke-[1.75] mx-auto text-slate-500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
</svg>
</div>
<!-- Empty State Text Notice -->
<p class="text-[11px] font-medium tracking-wide text-slate-600 uppercase select-none">
            Ainda não existem links cadastrados
          </p>
</div>
</section>
<!-- END: MyLinksCard -->
</div>
<!-- END: ContentGrid -->
</main>
<!-- END: MainContainer -->


</body></html>
